<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="honeyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4A029"/>
      <stop offset="50%" style="stop-color:#F5D061"/>
      <stop offset="100%" style="stop-color:#D4A029"/>
    </linearGradient>
    <linearGradient id="jarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B4513"/>
      <stop offset="100%" style="stop-color:#5E4B1F"/>
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#FFF8E7" stroke="url(#honeyGrad)" stroke-width="3"/>
  
  <!-- Honey jar -->
  <path d="M70 70 L70 160 Q70 175 85 175 L115 175 Q130 175 130 160 L130 70 Z" fill="url(#jarGrad)" opacity="0.9"/>
  
  <!-- Honey inside jar -->
  <path d="M75 75 L75 155 Q75 165 85 165 L115 165 Q125 165 125 155 L125 75 Q100 85 75 75 Z" fill="url(#honeyGrad)"/>
  
  <!-- Jar lid -->
  <rect x="65" y="55" width="70" height="18" rx="3" fill="#D4A029"/>
  <rect x="63" y="50" width="74" height="8" rx="2" fill="#B8860B"/>
  
  <!-- Bee -->
  <ellipse cx="100" cy="45" rx="25" ry="15" fill="#FFD700"/>
  <ellipse cx="100" cy="45" rx="8" ry="14" fill="#000"/>
  <ellipse cx="88" cy="45" rx="3" ry="3" fill="#000"/>
  <ellipse cx="112" cy="45" rx="3" ry="3" fill="#000"/>
  <ellipse cx="83" cy="42" rx="5" ry="3" fill="#FFF" opacity="0.8"/>
  <ellipse cx="117" cy="42" rx="5" ry="3" fill="#FFF" opacity="0.8"/>
  
  <!-- Wings -->
  <ellipse cx="78" cy="35" rx="12" ry="8" fill="#FFF" opacity="0.6" transform="rotate(-20 78 35)"/>
  <ellipse cx="122" cy="35" rx="12" ry="8" fill="#FFF" opacity="0.6" transform="rotate(20 122 35)"/>
  
  <!-- Text -->
  <text x="100" y="195" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="600" fill="#5E4B1F">NECTORNEST</text>
</svg>